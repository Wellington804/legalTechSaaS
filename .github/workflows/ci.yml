name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: legaltech_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legaltech_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      - name: Install document renderer and licensed fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation2
      - name: Audit the hashed Linux dependency lock
        run: |
          python -m venv /tmp/legaltech-pip-audit
          /tmp/legaltech-pip-audit/bin/pip install pip-audit
          /tmp/legaltech-pip-audit/bin/pip-audit -r backend/requirements.lock --strict --require-hashes --disable-pip
      - name: Migrate and grant the actual runtime RLS role
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/legaltech_ci
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: legaltech_ci
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_DB: legaltech_ci
          POSTGRES_USER: postgres
          POSTGRES_ADMIN_USER: postgres
          POSTGRES_APP_USER: legaltech_app
          POSTGRES_APP_PASSWORD: ci-runtime-password
        run: |
          (cd backend && alembic upgrade head)
          sh deploy/postgres/init-runtime-role.sh
          sh deploy/postgres/grant-runtime-role.sh
      - name: Run unit tests plus PostgreSQL RLS notification recovery tests
        env:
          DATABASE_URL: postgresql+asyncpg://legaltech_app:ci-runtime-password@127.0.0.1:5432/legaltech_ci
          AUDIT_TEST_DATABASE_URL: postgresql+asyncpg://legaltech_app:ci-runtime-password@127.0.0.1:5432/legaltech_ci
          ACCOUNT_TEST_DATABASE_URL: postgresql+asyncpg://legaltech_app:ci-runtime-password@127.0.0.1:5432/legaltech_ci
        run: (cd backend && python -m unittest discover -s tests -v)

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: node --test tests/*.test.cjs
      - working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run build
      - working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: legaltech_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d legaltech_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://legaltech_app:e2e-runtime-password@127.0.0.1:5432/legaltech_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: e2e-only-secret-key-with-at-least-32-bytes
      ACCOUNT_TOKEN_PEPPER: e2e-only-account-token-pepper-32-bytes
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r backend/requirements.lock
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Migrate and grant the runtime RLS role
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/legaltech_e2e
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: legaltech_e2e
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_ADMIN_USER: postgres
          POSTGRES_APP_USER: legaltech_app
          POSTGRES_APP_PASSWORD: e2e-runtime-password
        run: |
          (cd backend && alembic upgrade head)
          sh deploy/postgres/init-runtime-role.sh
          sh deploy/postgres/grant-runtime-role.sh
      - name: Build and start the real application
        run: |
          echo "MFA_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          (cd frontend && npm run build)
      - name: Exercise browser flow against PostgreSQL
        env:
          AUDIT_REGISTER: 'true'
          AUDIT_FRONTEND_URL: http://localhost:3000
          AUDIT_API_URL: http://localhost:8000/api/v1
        run: |
          (cd backend && nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/legaltech-backend.log 2>&1 &)
          (cd frontend && nohup npm start >/tmp/legaltech-frontend.log 2>&1 &)
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/readyz >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/readyz >/dev/null || { cat /tmp/legaltech-backend.log; exit 1; }
          curl -fsS http://127.0.0.1:3000 >/dev/null || { cat /tmp/legaltech-frontend.log; exit 1; }
          (cd frontend && node tests/local-smoke.cjs) || { cat /tmp/legaltech-backend.log; cat /tmp/legaltech-frontend.log; exit 1; }
