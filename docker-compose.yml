x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@db:5432/legaltech_db
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: development-only-change-me-32-bytes
  ENVIRONMENT: development
  PROTOTYPE_MODULES_ENABLED: "false"
  SUPPORT_URL: ${SUPPORT_URL:-}
  RELEASE: ${RELEASE:-local}
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_PROVIDER: ${AI_PROVIDER:-openrouter}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
  OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-LexFlow}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  DJEN_API_URL: ${DJEN_API_URL:-https://comunicaapi.pje.jus.br/api/v1/comunicacao}
  DOMICILIO_JUDICIAL_API_URL: ${DOMICILIO_JUDICIAL_API_URL:-}
  DOMICILIO_JUDICIAL_API_TOKEN: ${DOMICILIO_JUDICIAL_API_TOKEN:-}
  DOMICILIO_JUDICIAL_TOKEN_HEADER: ${DOMICILIO_JUDICIAL_TOKEN_HEADER:-Authorization}
  DOMICILIO_JUDICIAL_HOMOLOGATED: ${DOMICILIO_JUDICIAL_HOMOLOGATED:-false}
  TRIBUNAL_SOURCE_CONNECTORS: '${TRIBUNAL_SOURCE_CONNECTORS:-{}}'
  GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
  GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
  GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
  GOOGLE_CALENDAR_WEBHOOK_URL: ${GOOGLE_CALENDAR_WEBHOOK_URL:-}
  MICROSOFT_CALENDAR_CLIENT_ID: ${MICROSOFT_CALENDAR_CLIENT_ID:-}
  MICROSOFT_CALENDAR_CLIENT_SECRET: ${MICROSOFT_CALENDAR_CLIENT_SECRET:-}
  MICROSOFT_CALENDAR_TENANT: ${MICROSOFT_CALENDAR_TENANT:-common}
  MICROSOFT_CALENDAR_REDIRECT_URI: ${MICROSOFT_CALENDAR_REDIRECT_URI:-}
  MICROSOFT_CALENDAR_WEBHOOK_URL: ${MICROSOFT_CALENDAR_WEBHOOK_URL:-}
  WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
  WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
  WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
  WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: legaltech_postgres
    restart: always
    environment:
      POSTGRES_DB: legaltech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: legaltech_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: legaltechsaas-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legaltech_backend
    restart: always
    environment: *backend-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: legaltechsaas-backend
    restart: unless-stopped
    environment: *backend-environment
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: legaltechsaas-backend
    restart: unless-stopped
    environment: *backend-environment
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      - worker

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: legaltech_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
